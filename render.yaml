# Render Blueprint for Prana AI (Django).
# Deploy: push this repo to GitHub, then on Render choose "New +" -> "Blueprint"
# and point it at the repo. Render will prompt for the secret keys below.
databases:
  - name: prana-db
    databaseName: prana
    plan: free

services:
  - type: web
    name: prana-ai
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn medibuddy_project.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true          # Render generates a secure value
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: prana-db
          property: connectionString
      # Secrets below are prompted for at deploy time (never stored in git).
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
