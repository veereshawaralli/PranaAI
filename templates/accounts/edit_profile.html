{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Profile - Prana AI{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-3 mt-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-lines-fill fs-1 text-primary"></i>
                    <h2 class="fw-bold mt-2">Edit Profile</h2>
                    <p class="text-muted">Update your personal details</p>
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Save Changes</button>
                        <a href="{% url 'dashboard_home' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
