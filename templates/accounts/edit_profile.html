{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Profile - Prana AI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card animate-in" style="max-width: 520px;">
        <div class="text-center mb-4">
            <div class="auth-icon">
                <i class="bi bi-person-lines-fill"></i>
            </div>
            <h2 class="mt-2">Edit Profile</h2>
            <p class="text-muted">Update your personal details</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary py-2 fw-bold rounded-pill">Save Changes</button>
                <a href="{% url 'dashboard_home' %}" class="btn btn-outline-secondary rounded-pill">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
