{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% load static %}

{% block title %}Login - Prana AI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card animate-in">
        <div class="text-center mb-4">
            <div class="auth-icon">
                <i class="bi bi-person-circle"></i>
            </div>
            <h2 class="mt-2">Welcome Back</h2>
            <p class="text-muted">Login to your Prana AI account</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary py-2 fw-bold rounded-pill">Login</button>
            </div>
        </form>
        
        <div class="text-center mt-4">
            <p class="mb-0 text-muted">Don't have an account? <a href="{% url 'register' %}" class="text-teal-link">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
