{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% load static %}

{% block title %}Register - Prana AI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card animate-in" style="max-width: 520px;">
        <div class="text-center mb-4">
            <div class="auth-icon">
                <i class="bi bi-person-plus"></i>
            </div>
            <h2 class="mt-2">Create an Account</h2>
            <p class="text-muted">Join Prana AI to manage your health</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary py-2 fw-bold rounded-pill">Create Account</button>
            </div>
        </form>
        
        <div class="text-center mt-4">
            <p class="mb-0 text-muted">Already have an account? <a href="{% url 'login' %}" class="text-teal-link">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
