{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-robot"></i> MediBuddy AI Assistant</h5>
                </div>
                <div class="card-body">
                    {% if not api_key_set %}
                        <div class="alert alert-warning" role="alert">
                            <strong>Warning:</strong> GEMINI_API_KEY is not set in the environment. The chatbot will not be able to generate responses.
                        </div>
                    {% endif %}
                    
                    <div id="chat-window" class="border rounded p-3 mb-3 bg-light" style="height: 400px; overflow-y: auto;">
                        <div class="text-center text-muted mt-5">
                            <p>Ask me anything about health, symptoms, or well-being!</p>
                        </div>
                    </div>

                    <div class="input-group">
                        <input type="text" id="user-input" class="form-control" placeholder="Type your health query here..." aria-label="User Message">
                        <button class="btn btn-primary" type="button" id="send-btn" {% if not api_key_set %}disabled{% endif %}>
                            <i class="bi bi-send"></i> Send
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const sendBtn = document.getElementById('send-btn');
        const userInput = document.getElementById('user-input');
        const chatWindow = document.getElementById('chat-window');

        function appendMessage(sender, message, isUser) {
            // Remove initial placeholder if present
            const placeholder = chatWindow.querySelector('.text-center');
            if (placeholder) {
                placeholder.remove();
            }

            const msgDiv = document.createElement('div');
            msgDiv.classList.add('d-flex', 'mb-3');
            
            if (isUser) {
                msgDiv.classList.add('justify-content-end');
                msgDiv.innerHTML = `
                    <div class="p-3 bg-primary text-white rounded shadow-sm" style="max-width: 75%;">
                        <strong>You:</strong><br>${message}
                    </div>
                `;
            } else {
                msgDiv.classList.add('justify-content-start');
                // Format the markdown-like response simply (can be improved with marked.js later)
                const formattedMsg = message.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                msgDiv.innerHTML = `
                    <div class="p-3 bg-white text-dark border rounded shadow-sm" style="max-width: 75%;">
                        <strong>MediBuddy AI:</strong><br>${formattedMsg}
                    </div>
                `;
            }
            
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('You', message, true);
            userInput.value = '';
            
            // Show typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typing-indicator';
            typingDiv.classList.add('d-flex', 'justify-content-start', 'mb-3');
            typingDiv.innerHTML = `
                <div class="p-3 bg-white text-muted border rounded shadow-sm">
                    <small><em>AI is typing...</em></small>
                </div>
            `;
            chatWindow.appendChild(typingDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch('{% url "chatbot:send_message" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                
                // Remove typing indicator
                document.getElementById('typing-indicator').remove();

                if (response.ok) {
                    appendMessage('MediBuddy AI', data.reply, false);
                } else {
                    appendMessage('System', 'Error: ' + (data.error || 'Failed to get response'), false);
                }
            } catch (error) {
                document.getElementById('typing-indicator').remove();
                appendMessage('System', 'Network Error: ' + error.message, false);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    });
</script>
{% endblock %}
