{% extends 'base.html' %}

{% block title %}Delete Medicine Reminder - Prana AI{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="glass-card p-4 p-md-5 mt-4 mb-5 animate-in">
            <div class="text-center mb-4">
                <div class="section-icon mx-auto mb-3" style="background: rgba(244, 63, 94, 0.1); color: var(--medical-danger); width: 64px; height: 64px; font-size: 2rem;">
                    <i class="bi bi-exclamation-triangle"></i>
                </div>
                <h4 class="fw-bold">Delete Reminder</h4>
                <p class="text-muted">Are you sure you want to delete the reminder for <strong>{{ reminder.medicine_name }}</strong>?</p>
            </div>
            
            <form method="post" class="d-flex gap-3 justify-content-center">
                {% csrf_token %}
                <a href="{% url 'dashboard_home' %}" class="btn btn-outline-secondary px-4 py-2 rounded-pill fw-bold">Cancel</a>
                <button type="submit" class="btn btn-danger px-4 py-2 rounded-pill fw-bold shadow-sm">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
