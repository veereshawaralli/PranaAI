{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Upload Scan - Prana AI{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="glass-card p-4 p-md-5 mt-4 animate-in">
            <div class="text-center mb-4">
                <div class="auth-icon" style="background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);">
                    <i class="bi bi-lungs"></i>
                </div>
                <h2 class="fw-bold mt-2" style="color: var(--medical-darker);">AI Disease Detection</h2>
                <p class="text-muted">Upload an X-Ray or MRI for preliminary AI analysis</p>
            </div>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                {{ form|crispy }}
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold" style="background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%); border: none;">
                        <i class="bi bi-search"></i> Analyze with AI
                    </button>
                    <a href="{% url 'disease_detection:history' %}" class="btn btn-outline-secondary rounded-pill">View Past Scans</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
